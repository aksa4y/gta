<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>GTA Launcher</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="launcher" data-tauri-drag-region>
      <div class="reference" aria-hidden="true"></div>
      <button class="hotspot hamburger" aria-label="Open menu" data-action="menu"></button>
      <button class="hotspot contact" aria-label="Contact" data-action="contact"></button>
      <button class="hotspot discover" aria-label="Discover" data-action="discover"></button>
      <div class="menu-panel" data-menu>
        <button class="panel-close" data-action="menu">×</button>
        <div class="panel-kicker">GTA // LAUNCHER</div>
        <div class="panel-title">SYSTEM READY</div>
        <div class="panel-status"><span class="status-dot"></span> LOCAL CLIENT</div>
        <div class="panel-copy">Launcher controls are active. Game/update integration can be connected next.</div>
      </div>
      <div class="discover-modal" data-modal>
        <div class="modal-card">
          <button class="panel-close" data-action="discover" aria-label="Close">×</button>
          <div class="panel-kicker">DISCOVER</div>
          <div class="panel-title">ENTER THE WORLD</div>
          <p>The supplied reference composition is used as the exact launcher canvas.</p>
          <button class="modal-cta" data-action="launch">LAUNCH CLIENT</button>
          <div class="launch-result" data-launch-result>CLIENT STANDBY</div>
        </div>
      </div>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
